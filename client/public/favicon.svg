<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2025" />
      <stop offset="100%" stop-color="#0b0c0e" />
    </linearGradient>
    <linearGradient id="fr-dot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
  </defs>

  <!-- Modern squircle tile -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#fr-bg)" stroke="#2d3039" stroke-width="2" />

  <!-- Monogram "FR" typography -->
  <text
    x="30"
    y="44"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DM Sans', sans-serif"
    font-size="31"
    font-weight="900"
    letter-spacing="-1.5"
    fill="#ffffff"
    text-anchor="middle"
  >FR</text>

  <!-- FreeRoom live availability emerald dot -->
  <circle cx="50" cy="14" r="4.5" fill="url(#fr-dot)" />
  <circle cx="50" cy="14" r="6" fill="none" stroke="#4ade80" stroke-width="1" stroke-opacity="0.35" />
</svg>
