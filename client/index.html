<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FreeRoom - Find empty classrooms on campus. See which rooms are free right now and how long they'll stay empty." />
    <meta name="theme-color" content="#faf9f5" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>FreeRoom – Empty Classroom Finder</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('freeroom_theme');
          var prefDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (saved === 'dark' || saved === 'darker' || saved === 'light') ? saved : (prefDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) {
            if (theme === 'darker') m.setAttribute('content', '#05070a');
            else if (theme === 'dark') m.setAttribute('content', '#0d1117');
            else m.setAttribute('content', '#faf9f5');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
